[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narramotion"
version = "0.1.2"
description = "Batch Bible narration trimmer, Gemini STT/SRT generator, and FFmpeg image/BGM video renderer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.50.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
narramotion = "narramotion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
